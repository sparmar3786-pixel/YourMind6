name: Build Fresh AlgoDesk APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure app
        run: printf '%s\n' 'window.APP_CONFIG={API_BASE:"${{ secrets.API_BASE }}",APP_KEY:"${{ secrets.APP_KEY }}"};' > www/config.js
      - name: Install
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AlgoDesk-Pro-Fresh-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
