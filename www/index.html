function rowClass(r){let ce=r.ce||{},pe=r.pe||{},p=Number(ce.ltp||pe.ltp||0),oi=Number(ce.oi||pe.oi||0),pc=Number(ce.prevLtp||0),po=Number(ce.prevOi||0);if(!pc||!po)return 'OI n/a';if(p>pc&&oi>po)return 'Long Buildup';if(p<pc&&oi>po)return 'Short Buildup';if(p>pc&&oi<po)return 'Short Covering';if(p<pc&&oi<po)return 'Long Unwinding';return 'OI n/a'}function renderChain(){if(!chainData){return}let j=chainData,rows=(j.rows||[]).filter(r=>oiFilter==='All'||rowClass(r)===oiFilter);$('chain').innerHTML='<div class="grid"><div class="metric"><small>ATM</small><b>'+fmt(j.atm)+'</b></div><div class="metric"><small>PCR</small><b>'+Number(j.pcr).toFixed(2)+'</b></div></div><div class="chain"><table><tr><th>CE OI</th><th>CE LTP</th><th>Strike</th><th>PE LTP</th><th>PE OI</th><th>Setup</th></tr>'+rows.map(r=>'<tr class="'+(Math.abs(r.strike-j.atm)<1?'atm':'')+'" onclick="openAI('+JSON.stringify(r).replace(/"/g,'&quot;')+')"><td>'+fmt(r.ce?.oi)+'</td><td>'+fmt(r.ce?.ltp)+'</td><td><b>'+fmt(r.strike)+'</b></td><td>'+fmt(r.pe?.ltp)+'</td><td>'+fmt(r.pe?.oi)+'</td><td><small>'+rowClass(r)+'</small></td></tr>').join('')+'</table></div>'}
async function checkNSE(){let el=$('nseout'),bd=$('nsebadge');if(!el)return;el.textContent='Checking NSE server…';try{let j=await(await fetch(API+'/api/nse-check',{headers:HEAD})).json();bd.textContent=j.ok?'REACHABLE':'ERROR';bd.className='chip '+(j.ok?'up':'dn');el.textContent='NSE SERVER: HTTP '+j.status+' • '+j.message}catch(e){bd.textContent='ERROR';bd.className='chip dn';el.textContent='NSE check failed: '+e.message}}async function angelLogin(){let el=$('angelmsg');if(!el)return;el.textContent='Connecting to Angel One SmartAPI…';try{let b={clientCode:$('angelclient')?.value.trim(),mpin:$('angelmpin')?.value.trim(),totp:$('angeltotp')?.value.trim()};if(!$('angelkey')?.value.trim())throw Error('SmartAPI API Key is required');b.apiKey=$('angelkey').value.trim();let r=await fetch(API+'/api/angel/login',{method:'POST',headers:{...HEAD,'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Angel login failed');el.textContent=j.message+' • WebSocket '+(j.websocket?'ONLINE':'CONNECTING');let bd=$('angelbadge');if(bd){bd.textContent='CONNECTED';bd.className='chip up'}}catch(e){el.textContent='LOGIN ERROR: '+e.message;let bd=$('angelbadge');if(bd){bd.textContent='ERROR';bd.className='chip dn'}}}async function chain(){try{let j=await(await get('/api/option-chain?index='+idx)).json();if(!j.live)throw Error(j.error||'unavailable');chainData=j;renderChain()}catch(e){chainData=null;$('chain').textContent='Option chain unavailable: '+e.message}}
async function mcpConnect(){let el=$('mcpstatus');el.textContent='Connecting to NSE MCP…';try{let j=await(await fetch(API+'/api/nse-mcp/connect',{method:'POST',headers:HEAD})).json();if(!j.ok)throw Error(j.error||'connect failed');renderMcpTools(j.tools||[]);mcpConnected=true;let mb=$('mcpbadge');if(mb){mb.textContent='CONNECTED';mb.className='chip up'}el.textContent='CONNECTED · '+(j.protocolVersion||'MCP')+' · '+(j.tools||[]).length+' tools'}catch(e){let mb=$('mcpbadge');if(mb){mb.textContent='ERROR';mb.className='chip dn'}el.textContent='ERROR · '+e.message}}async function mcpTools(){let el=$('mcpstatus');el.textContent='Refreshing tools…';try{let j=await(await fetch(API+'/api/nse-mcp/tools',{method:'POST',headers:HEAD})).json();if(!j.ok)throw Error(j.error||'tools failed');renderMcpTools(j.tools||[]);el.textContent='CONNECTED · '+(j.tools||[]).length+' tools'}catch(e){el.textContent='ERROR · '+e.message}}function renderMcpTools(ts){let s=$('mcptool');if(!s)return;s.innerHTML=ts.length?ts.map(t=>'<option value="'+String(t.name).replace(/"/g,'&quot;')+'">'+String(t.name).replace(/</g,'&lt;')+'</option>').join(''):'<option value="">No tools</option>';$('mcpcount').textContent=ts.length;mcpSchema()}function mcpSchema(){let s=$('mcptool'),o=$('mcpargs');if(!s||!o)return;o.value='{}'}async function mcpCall(){let n=$('mcptool').value;if(!n){$('mcpout').textContent='Select an NSE MCP tool first.';return}let args={};try{args=JSON.parse($('mcpargs').value||'{}')}catch(e){$('mcpout').textContent='Invalid JSON arguments';return}$('mcpout').textContent='Calling '+n+'…';try{let j=await(await fetch(API+'/api/nse-mcp/call',{method:'POST',headers:{...HEAD,'content-type':'application/json'},body:JSON.stringify({name:n,arguments:args})})).json();$('mcpout').textContent=JSON.stringify(j.ok?j.result:j,null,2)}catch(e){$('mcpout').textContent='ERROR · '+e.message}}async function search(){let q=$('q').value.trim();if(!q)return;$('res').innerHTML='<div class="card">Searching…</div>';let j=await(await get('/api/search?q='+encodeURIComponent(q))).json();$('res').innerHTML=(j.results||[]).map(r=>'<div class="card"><b>'+r.title+'</b><p class="muted">'+r.desc+'</p><button class="btn" onclick="openAI('+JSON.stringify(r).replace(/"/g,'&quot;')+')">AI reads this</button></div>').join('')}
async function handleFile(f){if(!f)return;let info=$('fileinfo'),pre=$('datapreview');info.textContent=f.name+' • '+Math.round(f.size/1024)+' KB';if(f.name.toLowerCase().endsWith('.csv')){let t=await f.text();pre.textContent=t.slice(0,12000)+(t.length>12000?'\\n…preview truncated':'');}else pre.textContent='File selected: '+f.name+'\\nType: '+(f.type||'unknown')+'\\nThe file is ready for a future server/AI extraction step; no data is fabricated.'} function aiOpen(){ $('sheet').classList.remove('hide') }function aiClose(){ $('sheet').classList.add('hide') }function openAI(x){aiOpen();$('aiout').textContent='AI reading selected data…';fetch(API+'/api/ai',{method:'POST',headers:{...HEAD,'content-type':'application/json'},body:JSON.stringify({item:x})}).then(r=>r.json()).then(j=>$('aiout').textContent=j.text||j.error||'No answer').catch(e=>$('aiout').textContent='AI unavailable')}
function ask(){let q=$('aiq').value.trim();if(q)openAI({question:q,visibleTab:tab,index:idx})}nav();load();startLive();setInterval(load,60000);
</script></body></html>
