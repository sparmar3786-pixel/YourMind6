<!doctype html>
<html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AlgoDesk</title><script src="config.js"></script>
<style>
:root{--bg:#0b1220;--card:#121c2e;--ink:#edf3ff;--mut:#91a0b8;--line:#25334d;--up:#36d38a;--dn:#ff6670;--ac:#7fa2ea;--warn:#f2b84b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:560px;margin:auto;padding:14px 14px 90px}header,.row{display:flex;justify-content:space-between;gap:9px;align-items:center}h1{margin:0;font-size:23px}.sub,.small{color:var(--mut);font-size:12px}.pill{padding:5px 9px;border-radius:99px;background:#332b16;color:var(--warn);font-weight:700}.tickers,.chips{display:flex;gap:7px;overflow:auto;padding:10px 0;scrollbar-width:none}.tk,.chip,.card{border:1px solid var(--line);background:var(--card);border-radius:12px}.tk{min-width:132px;padding:9px}.tk b{color:var(--mut);font-size:11px}.tk strong{display:block;font-size:16px;margin:2px 0}.chip{color:var(--ink);padding:7px 11px;white-space:nowrap}.chip.go{background:var(--ac);color:#07101e;border:0;font-weight:800}.card{padding:13px;margin:0 0 10px}.li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.sym{font-size:16px;font-weight:800}.up{color:var(--up)}.dn{color:var(--dn)}.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:7px;background:#20382d;color:var(--up)}.badge.d{background:#42232a;color:var(--dn)}.badge.w{background:#382f19;color:var(--warn)}h2{font-size:15px;margin:16px 2px 8px}.bar{height:9px;border-radius:9px;background:#25334d}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:9px}input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0f1727;color:var(--ink);font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .card{margin:0}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:5}.navin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}.nav button{background:none;border:0;color:var(--mut);padding:9px 1px;font-size:10px}.nav button.active{color:var(--ac);font-weight:800}.fab{position:fixed;right:15px;bottom:70px;border:0;border-radius:99px;padding:11px 15px;background:var(--ac);font-weight:900;z-index:4}.sheet{position:fixed;inset:0;background:#0008;z-index:10}.sheet section{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--card);border-radius:18px 18px 0 0;padding:14px;max-height:82vh;overflow:auto}pre{white-space:pre-wrap;font:14px/1.55 inherit}a{color:var(--ac)}
</style></head><body>
<div class="app"><header><div><h1>AlgoDesk</h1><div id="clock" class="sub">Index option signals · OI · AI</div></div><span id="status" class="pill">Demo data</span></header><div id="tickers" class="tickers"></div><main id="view"></main></div>
<button id="fab" class="fab">✦ AI</button><nav class="nav"><div id="nav" class="navin"></div></nav>
<div id="sheet" class="sheet" hidden><section><div class="row"><b>AlgoDesk AI</b><button id="close" class="chip">✕</button></div><div class="small">सिर्फ दिए गए डेटा पर जानकारी; कोई buy/sell आदेश नहीं।</div><pre id="aiBody">AI सोच रहा है…</pre><div class="row"><input id="aiQ" placeholder="AI से पूछें…"><button id="send" class="chip go">भेजें</button></div></section></div>
<script>
const C=window.APP_CONFIG||{},API=(C.API_BASE||'').replace(/\/$/,'');
let tab='market',live=false;
let idx=[['NIFTY 50',25184.3,.42],['BANKNIFTY',54301.2,.35],['FINNIFTY',26012.5,.28],['SENSEX',82146.8,.39],['MIDCPNIFTY',13120.4,.31]];
let stocks=[['RELIANCE',2948.5,.82,1.9],['HDFCBANK',1669.2,-.74,2.6],['SBIN',813.1,.91,-1.8],['TATAMOTORS',968.4,-.66,-2.2],['INFY',1843,.58,1.4],['ICICIBANK',1214.6,-.48,1.7],['TCS',3905,.44,-1.2],['BAJFINANCE',6940,-.92,-1.9],['ITC',468.3,.52,2.3],['LT',3610,-.41,1.1]].map(x=>({s:x[0],p:x[1],chg:x[2],oiChg:x[3]}));
const signals=[['NIFTY 50','CALL','25200',112,88,158,84,212],['BANKNIFTY','PUT','54300',245,195,345,81,164],['SENSEX','CALL','82200',310,250,430,82,138]];
const hidden={'NIFTY 50':1,'BANKNIFTY':2,'FINNIFTY':2,'SENSEX':1,'MIDCPNIFTY':3};
const chain=[[24900,90,180],[25000,120,240],[25100,180,310],[25200,420,170],[25300,360,130]];
const money=n=>Number(n).toLocaleString('en-IN',{maximumFractionDigits:2}),pct=n=>(n>=0?'+':'')+Number(n).toFixed(2)+'%';
function oi(x){if(x.oiChg==null)return['OI n/a','w'];if(x.chg>=0&&x.oiChg>=0)return['Long Buildup',''];if(x.chg<0&&x.oiChg>=0)return['Short Buildup','d'];if(x.chg>=0&&x.oiChg<0)return['Short Covering',''];return['Long Unwinding','d']}
function verified(x){return false}
function ev(x){return(x[6]/100)*(x[5]-x[3])-(1-x[6]/100)*(x[3]-x[4])}
function stock(x){let t=oi(x);return '<div class="li"><div><div class="sym">'+x.s+'</div><span class="badge '+t[1]+'">'+t[0]+'</span></div><div><b>'+money(x.p)+'</b><div class="'+(x.chg>=0?'up':'dn')+'">'+pct(x.chg)+' · OI '+(x.oiChg==null?'n/a':pct(x.oiChg))+'</div></div></div>'}
function market(){let up=stocks.filter(x=>x.chg>=0).length,s=[...stocks].sort((a,b)=>b.chg-a.chg);return '<div class="card"><div class="row"><b>Market breadth</b><span class="small">'+up+' up · '+(stocks.length-up)+' down</span></div><div class="bar" style="margin-top:9px;background:linear-gradient(90deg,var(--up) '+(up/stocks.length*100)+'%,var(--dn) '+(up/stocks.length*100)+'%)"></div></div><h2>Top gainers</h2><div class="card">'+s.slice(0,3).map(stock).join('')+'</div><h2>Top losers</h2><div class="card">'+s.slice(-3).reverse().map(stock).join('')+'</div>'}
function signalsView(){return '<div class="chips">'+idx.map(x=>'<button class="chip">'+x[0]+'</button>').join('')+'</div>'+idx.map(i=>{let x=signals.find(s=>s[0]===i[0]&&verified(s));return x?'<div class="card"><div class="row"><b>'+x[0]+'</b><span class="badge">'+x[1]+' · demo</span></div><div class="small">Strike '+x[2]+'</div><div class="bar" style="margin:20px 0;background:linear-gradient(90deg,var(--dn) 0 35%,var(--up) 35% 75%,#25334d 75%)"></div><div class="row small"><span>SL ₹'+money(x[4])+'</span><span>Entry ₹'+money(x[3])+'</span><span>Target ₹'+money(x[5])+'</span></div><div class="meta"><span>Win rate <b class="up">'+x[6]+'%</b> / '+x[7]+' trades</span><span>R:R 1:'+((x[5]-x[3])/(x[3]-x[4])).toFixed(1)+'</span><span>EV ₹'+ev(x).toFixed(1)+'</span></div><div class="meta">Exit: target, SL or 15:15</div></div>':'<div class="card"><b>'+i[0]+'</b><div class="small">No signal right now · '+hidden[i[0]]+' weaker setup(s) hidden</div></div>'}).join('')}
function oiLab(){let ce=chain.reduce((a,x)=>a+x[1],0),pe=chain.reduce((a,x)=>a+x[2],0),sup=chain.reduce((a,x)=>x[2]>a[2]?x:a),res=chain.reduce((a,x)=>x[1]>a[1]?x:a);return '<h2>OI classification</h2><div class="card">'+stocks.map(stock).join('')+'</div><h2>NIFTY option chain</h2><div class="card"><div class="row"><span>PCR <b>'+(pe/ce).toFixed(2)+'</b></span><span class="small">Support '+sup[0]+' · Resistance '+res[0]+'</span></div>'+chain.map(x=>'<div class="li"><span>'+x[0]+'</span><span>CE '+x[1]+'L · PE '+x[2]+'L</span></div>').join('')+'</div>'}
function watch(){return '<div class="card">'+stocks.map(stock).join('')+'</div>'}
function search(){return '<div class="card"><input id="sq" placeholder="NIFTY OI, market news…"><div class="row" style="margin-top:8px"><button id="s" class="chip go">Search</button><button id="sa" class="chip go">Search + AI</button></div><div id="sr"></div></div><div class="card"><b>Broker screen AI</b><div class="small">Photo/text पढ़ें; password/PIN/OTP न दें।</div><textarea id="paste" rows="4" placeholder="Broker data paste करें"></textarea><input id="photo" type="file" accept="image/*" style="margin-top:8px"><button id="pa" class="chip go" style="margin-top:8px">AI से पढ़वाएँ</button></div>'}
function more(){return '<div class="card"><div class="row"><b>Angel One connection</b><span class="pill">'+(live?'Live':'Demo data')+'</span></div><p class="small">Quotes server के जरिए आते हैं। Broker credentials केवल server पर रहते हैं।</p></div><div class="grid">'+['Charts','Option chain','Positions · view only','Holdings · view only','Order book · view only','Price alerts','Scanners','News'].map(x=>'<div class="card"><b>'+x+'</b></div>').join('')+'</div>'}
function render(){document.getElementById('tickers').innerHTML=idx.map(x=>'<div class="tk"><b>'+x[0]+'</b><strong>'+money(x[1])+'</strong><span class="'+(x[2]>=0?'up':'dn')+'">'+pct(x[2])+'</span></div>').join('');document.getElementById('view').innerHTML={market:market,signals:signalsView,oi:oiLab,watch:watch,search:search,more:more}[tab]();document.getElementById('nav').innerHTML=[['market','Market'],['signals','Signals'],['oi','OI Lab'],['watch','Watch'],['search','Search'],['more','More']].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>').join('');if(tab==='search')initSearch()}
function api(path,opt){if(!API)return Promise.reject(new Error('Backend not connected'));return fetch(API+path,Object.assign({headers:{'Content-Type':'application/json','x-app-key':C.APP_KEY||''}},opt||{})).then(async r=>{let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j})}
async function ask(q){document.getElementById('sheet').hidden=false;document.getElementById('aiBody').textContent='AI सोच रहा है…';try{let j=await api('/api/ai',{method:'POST',body:JSON.stringify({messages:[{role:'user',content:'सिर्फ दिए गए डेटा पर सरल हिंदी में 120 शब्दों के भीतर पाँच headings: क्या हो रहा है:, पॉज़िटिव:, नेगेटिव:, दिक्कत / रिस्क:, अब क्या देखें:। कोई आंकड़ा/खबर न गढ़ो, profit guarantee या buy/sell instruction न दो। सवाल: '+q+' DATA: '+JSON.stringify({indices:idx,stocks:stocks,signals:signals.filter(verified)})}]})});document.getElementById('aiBody').textContent=j.text}catch(e){document.getElementById('aiBody').textContent=e.message}}
function initSearch(){let q=document.getElementById('sq'),out=document.getElementById('sr');document.getElementById('s').onclick=async()=>{try{let j=await api('/api/search?q='+encodeURIComponent(q.value));out.innerHTML=(j.results||[]).map(r=>'<div class="card"><b>'+r.title+'</b><div class="small">'+r.desc+'</div><a href="'+r.url+'" target="_blank">'+r.url+'</a><br><button class="chip" onclick="readPage('+JSON.stringify(r.url)+')">AI reads this page</button></div>').join('')}catch(e){out.textContent=e.message}};document.getElementById('sa').onclick=()=>webAsk({q:q.value});document.getElementById('pa').onclick=async()=>{let t=document.getElementById('paste').value.trim(),f=document.getElementById('photo').files[0],images=[];if(f){let b=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});images=[{media_type:f.type,data:b}]}if(!t&&!f)return;try{let j=await api('/api/ai',{method:'POST',body:JSON.stringify({messages:[{role:'user',content:'इस broker data/screen को पढ़कर पाँच headings में सरल हिंदी में समझाओ। कोई buy/sell आदेश नहीं।\n'+t}],images:images})});out.textContent=j.text}catch(e){out.textContent=e.message}}}
async function readPage(url){try{let j=await api('/api/webask',{method:'POST',body:JSON.stringify({url:url})});alert(j.text)}catch(e){alert(e.message)}}
async function webAsk(body){try{let j=await api('/api/webask',{method:'POST',body:JSON.stringify(body)});document.getElementById('sr').innerHTML='<pre>'+j.text+'</pre>'}catch(e){document.getElementById('sr').textContent=e.message}}
document.getElementById('close').onclick=()=>document.getElementById('sheet').hidden=true;document.getElementById('fab').onclick=()=>ask('पूरे market का data समझाओ');document.getElementById('send').onclick=()=>ask(document.getElementById('aiQ').value||'इस data को समझाओ');
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}),1000);
async function pull(){if(!API)return;try{let j=await api('/api/quotes');(j.indices||[]).forEach(q=>{let x=idx.find(i=>i[0]===q.n);if(x){x[1]=q.p;x[2]=q.chg}});(j.stocks||[]).forEach(q=>{let x=stocks.find(s=>s.s===q.s);if(x)Object.assign(x,q)});live=true;document.getElementById('status').textContent='Live · Angel One';render()}catch(e){live=false;document.getElementById('status').textContent='Demo data'}}setInterval(pull,5000);pull();render();
</script></body></html>
